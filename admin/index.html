<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel · Goiânia Plásticos</title>
<link rel="icon" type="image/svg+xml" href="../img/logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FAF8F3; --surface:#FFFFFF; --surface-2:#F1EDE3; --ink:#1B2420; --muted:#5A665F; --line:#E4DFD2;
  --verde:#17603F; --verde-ink:#FFFFFF; --verde-deep:#0C3D29; --titulo:#0C3D29; --verde-tint:#E5F0E9;
  --laranja:#FE7834; --laranja-ink:#9A3A07; --laranja-tint:#FFEDE0; --sand:#F4EFE6;
  --wa:#0E7A40; --wa-ink:#FFFFFF; --focus:#17603F;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#16201B; --surface-2:#1E2B24; --ink:#EDF2EE; --muted:#9BAAA1; --line:#2A3A31;
  --verde:#5CC592; --verde-ink:#07281A; --verde-deep:#0A241A; --titulo:#DDF3E6; --verde-tint:#17302478;
  --laranja:#FF8A4C; --laranja-ink:#FFB68C; --laranja-tint:#3A2314; --sand:#1A231E;
  --wa:#1FA85B; --wa-ink:#04210F; --focus:#FF8A4C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --surface-2:#1E2B24; --ink:#EDF2EE; --muted:#9BAAA1; --line:#2A3A31;
  --verde:#5CC592; --verde-ink:#07281A; --verde-deep:#0A241A; --titulo:#DDF3E6; --verde-tint:#17302478;
  --laranja:#FF8A4C; --laranja-ink:#FFB68C; --laranja-tint:#3A2314; --sand:#1A231E;
  --wa:#1FA85B; --wa-ink:#04210F; --focus:#FF8A4C; color-scheme:dark}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding-bottom:84px}
</style>
<style>
*,*::before,*::after{box-sizing:border-box}
body{padding-bottom:40px}
h1,h2{font-family:var(--f-display);font-stretch:112%;color:var(--titulo);margin:0}
.ad{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
header.ad-top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.ad-top .ad{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.ad-top b{font-family:var(--f-display);font-stretch:112%;font-size:1.05rem;color:var(--titulo)}
.btn{font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:2px solid transparent;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none}
.btn-main{background:var(--verde);color:var(--verde-ink)} .btn-line{background:var(--surface);border-color:var(--line);color:var(--ink)} .btn-sm{min-height:40px;padding:0 14px;font-size:.92rem}
.btn:disabled{opacity:.5}
.card1{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}
label{display:block;font-weight:700;font-size:.92rem;margin:14px 0 6px}
input,select{width:100%;min-height:50px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1rem}
input:focus,select:focus{outline:none;border-color:var(--verde)}
.msg{margin:12px 0 0;padding:10px 14px;border-radius:12px;font-weight:600;background:var(--verde-tint);color:var(--titulo)} .msg.err{background:var(--laranja-tint);color:var(--laranja-ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{font:inherit;font-weight:600;min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:var(--verde-ink)}
.it{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.it .th{width:56px;height:56px;border-radius:10px;background:var(--surface-2);object-fit:cover;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.7rem;text-align:center}
.it .th img{width:100%;height:100%;object-fit:cover}
.it b{display:block;line-height:1.25;overflow-wrap:anywhere} .it small{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.seg button{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--ink);padding:0 4px}
.seg button[aria-pressed="true"].s-disponivel{background:var(--verde);border-color:var(--verde);color:var(--verde-ink)}
.seg button[aria-pressed="true"].s-sob_consulta{background:var(--laranja);border-color:var(--laranja);color:#1c0e04}
.seg button[aria-pressed="true"].s-oculto{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.row2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.9rem}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tabs .tab{flex:none;min-height:44px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:inherit;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap}
.tabs .tab small{font-weight:600;color:var(--muted);margin-left:6px}
.tabs .tab[aria-selected="true"]{background:var(--verde-deep);border-color:var(--verde-deep);color:#fff}
.tabs .tab[aria-selected="true"] small{color:#B9D3C4}
.tabs.sub .tab{min-height:38px;font-size:.9rem;border-radius:999px;padding:0 14px}
.tabs.sub{margin-top:6px}
.pv{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--surface-2);margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="ad-top"><div class="ad"><b>Painel · Goiânia Plásticos</b><div><button class="btn btn-line btn-sm" id="out" hidden>Sair</button></div></div></header>
<main class="ad">
  <noscript><p class="msg err">Ative o JavaScript para usar o painel.</p></noscript>
  <p class="msg err" id="boot" hidden></p>
  <section id="login" class="card1">
    <h1 style="font-size:1.5rem">Entrar</h1>
    <p class="hint">Acesso restrito ao administrador do site.</p>
    <form id="fl"><label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" required minlength="8">
    <div class="row2"><button class="btn btn-main" type="submit">Entrar</button><button class="btn btn-line" type="button" id="reg">Criar acesso (primeira vez)</button></div></form>
    <p class="msg" id="lm" hidden></p>
  </section>

  <section id="app" hidden>
    <div class="card1" style="margin-top:14px">
      <button class="btn btn-main" id="novo" style="width:100%">+ Cadastrar item novo</button>
      <form id="fn" hidden>
        <h2 style="font-size:1.25rem;margin-top:16px">Item novo</h2>
        <label for="nc">Código (o mesmo do sistema da loja)</label><input id="nc" type="number" inputmode="numeric" min="1" required>
        <label for="nn">Nome</label><input id="nn" type="text" required maxlength="120" placeholder="Ex.: Tecido Jacar Exemplo Azul">
        <label for="nf">Categoria</label><select id="nf" required></select>
        <label for="nu">Vendido por</label><select id="nu"><option>metro</option><option>unidade</option><option>caixa</option><option>kg</option><option>jogo</option><option>pacote</option><option>rolo</option></select>
        <label for="ns">Situação</label><select id="ns"><option value="disponivel">Disponível</option><option value="sob_consulta">Sob consulta</option></select>
        <label for="np">Foto (opcional)</label><input id="np" type="file" accept="image/*" capture="environment">
        <img class="pv" id="npv" alt="" hidden>
        <div class="row2"><button class="btn btn-main" type="submit">Salvar item</button><button class="btn btn-line" type="button" id="ncancel">Cancelar</button></div>
      </form>
    </div>
    <div class="card1">
      <div class="tabs" id="cats" role="tablist" aria-label="Categorias"></div>
      <div class="tabs sub" id="subs" aria-label="Subcategorias" hidden></div>
      <label for="q" style="margin-top:14px">Buscar item</label>
      <input id="q" type="search" placeholder="Nome ou código" autocomplete="off">
      <div class="bar" id="flt"></div>
      <p class="hint" id="cnt"></p>
      <div id="list"></div>
      <div class="row2" style="justify-content:center"><button class="btn btn-line" id="more" hidden>Mostrar mais</button></div>
    </div>
    <p class="msg" id="gm" hidden></p>
  </section>
</main>
<input id="pf" type="file" accept="image/*" capture="environment" hidden>
<script src="vendor/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/catalogo.js"></script>
<script src="admin.js"></script>
</body>
</html>
